versao_esquema: 2
perfil:
  id: fasoft
  instituicao: "UniRV — Fasoft"
  semestre_pasta: "{ano}/{Primeiro|Segundo} Semestre"
  disciplina_pasta: '^(?P<num>\d{2}) - (?P<nome>.+?)(?: - (?P<periodo>\d+º Período|Turma Especial))?$'
  subpastas_disciplina: ["01 - Planejamento", "02 - Aulas", "03 - Atividades e Listas",
                         "04 - Projetos e Entregáveis", "05 - Materiais de Referência",
                         "06 - Código e Exemplos", "99 - Arquivo"]
  pasta_arquivo: "99 - Arquivo"
  pasta_avaliacoes: '^\d{2} - Avaliações$'
  pasta_modelos: '^\d{2} - Modelos$'
  etapas_avaliacao: [N1, N2, N3]
  nomenclatura:
    aula: '^Aula \d{2} - '
    lista: '^(Lista|Atividade|Aula) \d{2} - '
    pasta: '^\d{2} - '
    sufixos_proibidos: ['\(Revisado\)', '_v\d+\b', '\(v\d+\)', ' - [Cc][oó]pia\b', ' \(\d+\)\.', '\.bak$']
  # D3 (22/10/2026): hora-aula de 50 min; Ficha Carga Horária 2026-2 = 2 encontros de 100 min por semana.
  carga_horaria: { unidade: hora_aula, minutos_hora_aula: 50 }
  exclusao:
    - "*Notas*"
    - "* - TFC*/02 - Alunos"
    - "*Relatórios*"
    - "*/04 - Projetos e Entregáveis"
    - "* - Estágio"
  estrutura:
    semestre: '^(?P<ano>\d{4})/(?P<periodo>Primeiro|Segundo) Semestre$'
    periodos: {Primeiro: 1, Segundo: 2}
    administracao: '^00 - '
    papeis:
      planejamento: "01 - Planejamento"
      aulas: "02 - Aulas"
      atividades: "03 - Atividades e Listas"
      projetos: "04 - Projetos e Entregáveis"
      referencias: "05 - Materiais de Referência"
      codigo: "06 - Código e Exemplos"
      arquivo: "99 - Arquivo"
  modelos:
    slides: "Modelo de Slides UniRV"
    prova: "Modelo LaTeX/modelo-prova.tex"
